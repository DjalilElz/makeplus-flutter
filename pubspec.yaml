name: makeplus
description: "DendrIQ Event Management App"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Networking
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # UI Components
  cupertino_icons: ^1.0.8
  youtube_player_flutter: ^9.0.3
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0

  # Intl & Localization
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # Utils
  get_it: ^8.0.2 # DI — planned, see CLAUDE.md
  logger: ^2.5.0 # used by core/utils/app_logger.dart
  path_provider: ^2.1.4
  url_launcher: ^6.3.1

  # File sharing
  share_plus: ^12.0.2
  flutter_pdfview: ^1.4.4

# Removed 2026-07: supabase_flutter (initialised, never used), firebase_core +
# firebase_messaging + flutter_local_notifications (no native config existed — push
# notifications were never implemented), permission_handler, connectivity_plus,
# shimmer, flutter_spinkit, package_info_plus, pretty_dio_logger,
# syncfusion_flutter_datepicker, table_calendar.
#
# Removed 2026-08: image_picker. It had zero imports in lib/, but still caused
# ios/Runner/Info.plist to declare NSPhotoLibraryUsageDescription for a
# room/session image feature that does not exist — reviewers check that
# declared permissions map to real features (App Review Guideline 5.1.1).
#
# All had zero imports in lib/. Re-add deliberately if a feature needs them.

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

  # App icon generation -- dev-only, not shipped in the app
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  # Apple App Store Connect rejects icons with an alpha channel, even fully
  # opaque ones -- our source PNG carries one from dart:ui's RGBA export.
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # Fonts
  # TODO: Add Poppins font files to assets/fonts/ directory
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
